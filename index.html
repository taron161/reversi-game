<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2d6a4f">
    <title>Reversi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
    <div class="app" id="app">
        <!-- Шапка -->
        <header class="header">
            <div class="user-info">
                <img id="userAvatar" class="avatar" src="" alt="" style="display:none">
                <div class="user-text">
                    <div class="greeting" id="greeting">Reversi</div>
                    <div class="stats" id="stats">Wins: 0</div>
                </div>
            </div>
        </header>

        <h1 class="title">REVERSI</h1>

        <!-- Уровни -->
        <div class="difficulty-panel" id="difficultyPanel">
            <button data-level="easy" class="active">Easy</button>
            <button data-level="medium">Medium</button>
            <button data-level="hard">Hard</button>
        </div>

        <!-- Игровое поле (главный блок) -->
        <div class="board-wrapper">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="boardCanvas" width="560" height="560"></canvas>
            </div>

            <div class="status-bar">
                <div class="score">
                    <span><i class="disc black"></i> <span id="blackScore">2</span></span>
                    <span><i class="disc white"></i> <span id="whiteScore">2</span></span>
                </div>
                <div class="turn-indicator" id="turnIndicator">Your turn</div>
            </div>

            <div class="message" id="message"></div>

            <div class="buttons">
                <button class="new-game-btn" id="newGameBtn">New Game</button>
                <button class="share-btn" id="shareBtn">Share</button>
            </div>
        </div>

        <!-- Модалка -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <h2 id="modalTitle">Game Over</h2>
                <p id="modalText"></p>
                <div class="modal-buttons">
                    <button class="new-game-btn" id="modalNewGame">Play Again</button>
                    <button class="share-btn" id="modalShare">Share</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
